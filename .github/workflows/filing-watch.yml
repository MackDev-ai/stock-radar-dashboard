name: Filing Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-pages
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Watch SEC filings
        run: node scripts/filing-watcher.js

      - name: Save watcher state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filing-watch-state.json filing-watch.md
          git diff --cached --quiet || git commit -m "Update filing watch state"
          git push

      - name: Restore public dashboard data
        run: node scripts/restore-public-data.js

      - name: Build static site
        run: node scripts/build-online-dashboard.js

      - name: Check restored dashboard data
        env:
          REQUIRE_CANONICAL_DECISIONS: "false"
        run: node scripts/check-data-contract.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: watch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
