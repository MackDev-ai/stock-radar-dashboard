name: Filing Watch

on:
  workflow_dispatch:
    inputs:
      replay_days:
        description: "Reanalyze and republish filings from the last N days"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "15 */4 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-pages
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FILING_WATCH_REPLAY_DAYS: ${{ inputs.replay_days || '0' }}
      FILING_WATCH_DEFER_TELEGRAM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Restore public dashboard data
        env:
          RESTORE_PUBLIC_DATA_MODE: refresh-monitoring
        run: node scripts/restore-public-data.js

      - name: Check Filing Watch parser
        run: node scripts/check-filing-watcher.js

      - name: Watch SEC filings
        run: node scripts/filing-watcher.js

      - name: Render monitoring reports
        run: node scripts/render-monitoring-reports.js

      - name: Build static site
        run: node scripts/build-online-dashboard.js

      - name: Check restored dashboard data
        env:
          REQUIRE_CANONICAL_DECISIONS: "false"
          REQUIRE_FRESH_SNAPSHOT: "false"
          REQUIRE_EXECUTION_PLANS: "false"
        run: node scripts/check-data-contract.js

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.42.0 pages deploy site-dist --project-name stock-radar-dashboard --branch main --commit-dirty=true

      - name: Send published Filing Watch alerts
        run: node scripts/filing-watcher.js --send-outbox

      - name: Save watcher state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filing-watch-state.json filing-watch.md
          if ! git diff --cached --quiet; then
            git commit -m "Update filing watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: watch
    if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
