name: Cloudflare Pages Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "35 22 * * 1-5"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update monitoring data
        run: node scripts/update-monitoring.js

      - name: Generate deep dives
        run: node scripts/generate-deep-dive.js CANDIDATES

      - name: Generate valuation scenarios
        run: node scripts/valuation-scenarios.js

      - name: Generate sector radar
        run: node scripts/generate-sector-radar.js

      - name: Generate elite flow
        run: node scripts/update-elite-flow.js

      - name: Build static site
        run: node scripts/build-online-dashboard.js

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy site-dist --project-name stock-radar-dashboard --branch main --commit-dirty=true
