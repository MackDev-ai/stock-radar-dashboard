name: Cloudflare Pages Deploy

on:
  workflow_dispatch:

concurrency:
  group: stock-radar-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deployment."
            exit 1
          fi

      - name: Restore latest public runtime data
        env:
          RESTORE_PUBLIC_DATA_MODE: refresh
        run: node scripts/restore-public-data.js

      - name: Build static site
        run: node scripts/build-online-dashboard.js

      - name: Check data contract
        run: node scripts/check-data-contract.js

      - name: Check dashboard UI
        run: node scripts/check-dashboard-ui.js

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.42.0 pages deploy site-dist --project-name stock-radar-dashboard --branch main --commit-dirty=true
