name: Stock Radar Update

on:
  workflow_dispatch:
  schedule:
    - cron: "25 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-radar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MIN_SCORE: ${{ secrets.TELEGRAM_MIN_SCORE }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check canonical decision engine
        run: node scripts/check-canonical-decisions.js

      - name: Check hosting configuration
        run: node scripts/check-hosting-config.js

      - name: Update monitoring data
        run: node scripts/update-monitoring.js

      - name: Generate deep dives
        run: node scripts/generate-deep-dive.js DECISIONS

      - name: Generate valuation scenarios
        run: node scripts/valuation-scenarios.js

      - name: Generate sector radar
        run: node scripts/generate-sector-radar.js

      - name: Generate elite flow
        run: node scripts/update-elite-flow.js

      - name: Restore independent watcher data
        run: node scripts/restore-public-data.js

      - name: Build static site
        run: node scripts/build-online-dashboard.js

      - name: Check data contract
        run: node scripts/check-data-contract.js

      - name: Check verdict performance
        run: node scripts/check-verdict-performance.js

      - name: Check dashboard UI
        run: node scripts/check-dashboard-ui.js

      - name: Check Telegram alert format
        run: node scripts/check-telegram-alerts.js

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4.42.0 pages deploy site-dist --project-name stock-radar-dashboard --branch main --commit-dirty=true

      - name: Send Telegram alerts
        run: node scripts/send-telegram-alerts.js

      - name: Configure Pages
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    if: ${{ vars.ENABLE_GITHUB_PAGES != 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
