name: Dashboard UI Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "monitoring-dashboard.html"
      - "stock-map.html"
      - "scripts/build-online-dashboard.js"
      - ".github/workflows/dashboard-ui.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-radar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build static site from committed data
        run: node scripts/build-online-dashboard.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
